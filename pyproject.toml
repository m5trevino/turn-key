[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turnkey-sdk"
version = "0.2.0"
description = "TurnKey SDK — multi-gateway model rotation and stage execution for the Peacock engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Trevino", email = "flintx@dendritic.local" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
turnkey = "turnkey:main"

[tool.setuptools.packages.find]
include = ["turnkey*"]
exclude = ["tests*", "turnkey.tests*"]
